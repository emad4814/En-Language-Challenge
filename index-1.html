.opt.good,.chip.good{background:var(--ok);color:#fff}.opt.bad{background:var(--no);color:#fff;animation:sk .4s}

.top{display:flex;align-items:center;gap:10px}

.res{text-align:center}.res .st{font-size:3rem;letter-spacing:6px}.res .st span{display:inline-block;animation:pop .6s both}
.sp{position:fixed;top:-30px;font-size:1.6rem;pointer-events:none;animation:fall 1.4s linear forwards;z-index:9}
@keyframes fall{to{transform:translateY(105vh) rotate(360deg)}}

.magic{display:block;width:100%;margin:10px 0;background:linear-gradient(135deg,#7b2ff7,#f107a3);color:#fff;animation:glow 2.5s ease-in-out infinite}.magic span,.magic small{color:#fff}
@keyframes glow{50%{box-shadow:0 0 18px #f107a3aa}}

.toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);background:var(--pri);color:#fff;padding:12px 20px;border-radius:30px;font-weight:700;z-index:99;box-shadow:var(--sh);animation:pop .5s}
